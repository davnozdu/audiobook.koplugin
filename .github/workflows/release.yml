name: Build and Release

# Android only: the Lua plugin, the two Java helpers compiled to .dex, translations. No native binaries.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.7.0.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y luajit
          for t in dev/test_docstream.lua dev/test_reader.lua dev/lua_semantics_check.lua; do luajit "$t"; done

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build .dex helpers (the committed ones are used if the runner cannot)
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" "platforms;android-34" > /dev/null || true
          cd android && { bash build-dex.sh || git checkout -- tts_helper.dex media_session_helper.dex; }

      - name: Package
        run: |
          mkdir -p dist/audiobook.koplugin/android
          cp *.lua new_audio_logo.svg LICENSE README.md dist/audiobook.koplugin/
          cp -r l10n dist/audiobook.koplugin/
          cp android/*.dex dist/audiobook.koplugin/android/
          cd dist && zip -qr audiobook-koplugin-android.zip audiobook.koplugin

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="$(git tag -l --format='%(contents)' "$TAG")"
          gh release create "$TAG" dist/audiobook-koplugin-android.zip --title "$TAG" --notes "${NOTES:-$TAG}" --latest \
            || gh release upload "$TAG" dist/audiobook-koplugin-android.zip --clobber
